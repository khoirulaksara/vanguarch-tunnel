[package]
name = "vanguarch"
version = "2.1.0"
description = "Vanguarch Tunnel"
authors = ["Khoirul Aksara"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Optimasi: Hapus "full", gunakan hanya yang esensial untuk process & async
tokio = { version = "1.36", features = ["rt", "rt-multi-thread", "process", "sync", "io-util"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1.8.0", features = ["v4", "fast-rng"] }
reqwest = { version = "0.11", features = ["json"] }
base64 = "0.21"

# --- TAMBAHKAN BLOK INI UNTUK MEMANGKAS UKURAN HINGGA >50% ---
[profile.release]
panic = "abort"       # Membuang kode unwinding error yang memakan ruang
codegen-units = 1     # Memaksimalkan optimasi (waktu build sedikit lebih lama)
lto = true            # Membuang seluruh kode library yang tidak dipakai
opt-level = "s"       # Fokus optimasi pada ukuran file (size)
strip = true          # Membuang metadata debugging dari binary
